[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bisagym-api"
version = "0.1.0"
description = "Gym membership and biometric access API"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "numpy>=2.2,<3",
  "opencv-python-headless>=4.13,<4.14",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "pwdlib[argon2]>=0.2,<1",
  "PyJWT>=2.10,<3",
  "sqlalchemy>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
bisagym-seed = "app.seed:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
